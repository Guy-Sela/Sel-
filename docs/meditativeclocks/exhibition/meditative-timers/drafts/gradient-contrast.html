<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Max Contrast 10x10</title>
        <style>
            body {
                /* Black background for the entire page */
                background-color: black;
                margin: 0;
                height: 100vh;

                /* Flexbox to perfectly center the square */
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                /* Scale up the tiny 10x10 canvas to a visible size */
                width: 400px;
                height: 400px;

                /* Keeps the pixels sharp, preventing browser blurring */
                image-rendering: pixelated;
            }
        </style>
    </head>
    <body>
        <canvas id="artCanvas" width="10" height="10"></canvas>

        <script>
            const canvas = document.getElementById("artCanvas");
            const ctx = canvas.getContext("2d");

            const gridSize = 10;
            // Create an empty 10x10 grid to store our colors
            const grid = Array.from({ length: gridSize }, () =>
                Array(gridSize).fill(null),
            );

            // The "frontier" holds pixels we need to color next
            const frontier = [];
            // Keep track of what's already in the frontier to avoid duplicates
            const inFrontier = Array.from({ length: gridSize }, () =>
                Array(gridSize).fill(false),
            );

            // Helper to add valid, uncolored adjacent pixels to our queue
            function addFrontier(x, y) {
                if (
                    x >= 0 &&
                    x < gridSize &&
                    y >= 0 &&
                    y < gridSize &&
                    !grid[x][y] &&
                    !inFrontier[x][y]
                ) {
                    frontier.push({ x, y });
                    inFrontier[x][y] = true;
                }
            }

            // Helper: Calculate standard Euclidean distance between two RGB colors
            function colorDistance(c1, c2) {
                return Math.sqrt(
                    Math.pow(c1[0] - c2[0], 2) +
                        Math.pow(c1[1] - c2[1], 2) +
                        Math.pow(c1[2] - c2[2], 2),
                );
            }

            // --- STEP 1: THE SEED ---
            // Pick a random starting coordinate
            const startX = Math.floor(Math.random() * gridSize);
            const startY = Math.floor(Math.random() * gridSize);

            // Generate a random RGB color for the seed
            const startColor = [
                Math.floor(Math.random() * 256),
                Math.floor(Math.random() * 256),
                Math.floor(Math.random() * 256),
            ];

            // Place the seed on the grid
            grid[startX][startY] = startColor;

            // Add the immediately adjacent pixels (up, down, left, right) to the frontier
            const directions = [
                [0, -1],
                [1, 0],
                [0, 1],
                [-1, 0],
            ];
            for (const [dx, dy] of directions) {
                addFrontier(startX + dx, startY + dy);
            }

            // --- STEP 2: THE GROWTH (BFS) ---
            // Loop until there are no more pixels in the frontier queue
            while (frontier.length > 0) {
                // Take the first pixel in the queue (Breadth-First Search)
                // This creates the "expanding wave" effect mathematically
                const current = frontier.shift();
                const cx = current.x;
                const cy = current.y;

                // Find all directly adjacent neighbors that ALREADY have a color
                const coloredNeighbors = [];
                for (const [dx, dy] of directions) {
                    const nx = cx + dx;
                    const ny = cy + dy;
                    if (
                        nx >= 0 &&
                        nx < gridSize &&
                        ny >= 0 &&
                        ny < gridSize &&
                        grid[nx][ny]
                    ) {
                        coloredNeighbors.push(grid[nx][ny]);
                    }
                }

                // --- STEP 3: THE BEST CANDIDATE ALGORITHM ---
                let bestColor = null;
                let highestMinDistance = -1;
                const NUM_CANDIDATES = 30; // Generate 30 random colors to test

                for (let i = 0; i < NUM_CANDIDATES; i++) {
                    const candidateColor = [
                        Math.floor(Math.random() * 256),
                        Math.floor(Math.random() * 256),
                        Math.floor(Math.random() * 256),
                    ];

                    // Check distance against all colored neighbors
                    let shortestDistanceToANeighbor = Infinity;
                    for (const neighborColor of coloredNeighbors) {
                        const dist = colorDistance(
                            candidateColor,
                            neighborColor,
                        );
                        if (dist < shortestDistanceToANeighbor) {
                            shortestDistanceToANeighbor = dist;
                        }
                    }

                    // We want to maximize the shortest distance (push it as far away as possible)
                    if (shortestDistanceToANeighbor > highestMinDistance) {
                        highestMinDistance = shortestDistanceToANeighbor;
                        bestColor = candidateColor;
                    }
                }

                // Lock in the winning color
                grid[cx][cy] = bestColor;

                // Add the new uncolored neighbors of this pixel to the frontier
                for (const [dx, dy] of directions) {
                    addFrontier(cx + dx, cy + dy);
                }
            }

            // --- STEP 4: DRAW THE RESULT ---
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const color = grid[x][y];
                    ctx.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        </script>
    </body>
</html>
