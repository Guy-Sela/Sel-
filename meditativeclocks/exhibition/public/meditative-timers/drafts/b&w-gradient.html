<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Linear 10x10</title>
        <style>
            body {
                /* Black background for the entire page */
                background-color: black;
                margin: 0;
                height: 100vh;

                /* Flexbox to perfectly center the square */
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                /* Scale up the tiny 10x10 canvas to a visible size */
                width: 400px;
                height: 400px;

                /* This tells the browser to keep the pixels sharp, no blurring */
                image-rendering: pixelated;
            }
        </style>
    </head>
    <body>
        <!-- The actual canvas is strictly 10x10 pixels -->
        <canvas id="artCanvas" width="10" height="10"></canvas>

        <script>
            const canvas = document.getElementById("artCanvas");
            const ctx = canvas.getContext("2d");

            const gridSize = 10;

            // The maximum distance is from (0,0) to (9,9)
            // Max x (9) + Max y (9) = 18
            const maxDistance = (gridSize - 1) * 2;

            // Loop through every pixel in the 10x10 grid
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    // Calculate the linear distance from the top-left corner
                    // x + y gives us a value from 0 to 18.
                    // We divide by 18 to get a percentage from 0.0 to 1.0
                    const distancePercentage = (x + y) / maxDistance;

                    // White is 255, Black is 0.
                    // We invert the percentage so top-left is 255 and bottom-right is 0.
                    const intensity = Math.round(
                        255 - distancePercentage * 255,
                    );

                    // Assign the grayscale color to this specific pixel
                    ctx.fillStyle = `rgb(${intensity}, ${intensity}, ${intensity})`;

                    // Draw the pixel at coordinates (x, y) with a width and height of 1
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        </script>
    </body>
</html>
