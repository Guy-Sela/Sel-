<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>hourglass in zero gravity</title>
        <style>
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
                cursor: none;
            }

            svg {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            #hourglass {
                /* Transition is now permanent, no need to toggle it via JS */
                transition: transform var(--flip-duration) ease-in-out;
            }
        </style>
    </head>
    <body>
        <svg
            viewBox="0 0 100 100"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
        >
            <g id="hourglass">
                <circle id="circle-a" fill="white" />
                <circle id="circle-b" fill="white" />
            </g>
        </svg>

        <script>
            // ── dial these ────────────────────────────────────
            const CYCLE = 30; // seconds per half-cycle (fill/drain)
            const SIZE = 15; // circle diameter in vmin
            const GAP = 1; // gap between circles in vmin
            const FLIP_DURATION = 2; // seconds for the flip transition
            // ─────────────────────────────────────────────────

            const cx = 50;
            const cy = 50;
            const r = SIZE / 2;

            const topCy = cy - GAP / 2 - r;
            const botCy = cy + GAP / 2 + r;

            const elA = document.getElementById("circle-a");
            const elB = document.getElementById("circle-b");
            const group = document.getElementById("hourglass");

            // Fixed positions — they NEVER swap in the SVG attributes
            elA.setAttribute("cx", cx);
            elA.setAttribute("cy", topCy);
            elB.setAttribute("cx", cx);
            elB.setAttribute("cy", botCy);

            document.documentElement.style.setProperty(
                "--flip-duration",
                `${FLIP_DURATION}s`,
            );
            group.style.transformOrigin = `${cx}px ${cy}px`;

            let start = null;
            let flipping = false;
            let rotation = 0;

            let topEl = elA; // Logical pointer for the draining circle
            let botEl = elB; // Logical pointer for the filling circle

            function setRadii(t) {
                topEl.setAttribute("r", r * (1 - t));
                botEl.setAttribute("r", r * t);
            }

            function doFlip() {
                flipping = true;
                rotation += 180;
                group.style.transform = `rotate(${rotation}deg)`;

                setTimeout(() => {
                    // After flip, the group coordinate system is upside down.
                    // The circle at `botCy` is now visually on top.
                    // Simply swap the logical roles. No coordinate swaps or transform resets needed!
                    [topEl, botEl] = [botEl, topEl];

                    flipping = false;
                    start = null;
                }, FLIP_DURATION * 1000);
            }

            function frame(ts) {
                if (!flipping) {
                    if (!start) start = ts;
                    const elapsed = (ts - start) / 1000;
                    const t = Math.min(elapsed / CYCLE, 1);

                    setRadii(t);

                    if (elapsed >= CYCLE) {
                        setRadii(1);
                        doFlip();
                    }
                }

                requestAnimationFrame(frame);
            }

            setRadii(0);
            requestAnimationFrame(frame);
        </script>
    </body>
</html>
