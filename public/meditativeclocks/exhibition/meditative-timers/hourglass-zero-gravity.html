<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hourglass in zero gravity</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }

  svg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Top fill shrinks from full to zero */
  #top-fill {
    animation: shrink var(--cycle) linear infinite alternate;
    transform-origin: bottom center; /* anchor to bottom of top square */
  }

  /* Bottom fill grows from zero to full */
  #bot-fill {
    animation: grow var(--cycle) linear infinite alternate;
    transform-origin: bottom center; /* anchor to bottom of bottom square */
  }

  @keyframes shrink {
    from { transform: scaleY(1); }
    to   { transform: scaleY(0); }
  }

  @keyframes grow {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-top">
      <rect id="clip-top-rect" />
    </clipPath>
    <clipPath id="clip-bot">
      <rect id="clip-bot-rect" />
    </clipPath>
  </defs>

  <rect id="top-fill" fill="white" clip-path="url(#clip-top)" />
  <rect id="bot-fill" fill="white" clip-path="url(#clip-bot)" />
</svg>

<script>
  // ── dial these ────────────────────────────────────
  const CYCLE  = 30;   // seconds for one half-cycle (full→empty or empty→full)
  const SIZE   = 35;   // square side length in vmin
  const GAP    = 6;    // gap between the two squares in vmin
  const STROKE = 0.4;  // square stroke width in vmin
  // ─────────────────────────────────────────────────

  const cx      = 50;
  const cy      = 50;
  const half    = SIZE / 2;
  const halfGap = GAP / 2;
  const inset   = STROKE / 2; // inner edge of stroke

  // Top square: bottom edge at cy - halfGap
  const topY  = cy - halfGap - SIZE;  // top-left y
  const topX  = cx - half;            // top-left x

  // Bottom square: top edge at cy + halfGap
  const botY  = cy + halfGap;
  const botX  = cx - half;

  const innerSize = SIZE;
  const innerX    = topX;

  // Top square
  // squares removed

  // Clip rects (interior of each square)
  document.getElementById('clip-top-rect').setAttribute('x',      innerX);
  document.getElementById('clip-top-rect').setAttribute('y',      topY);
  document.getElementById('clip-top-rect').setAttribute('width',  innerSize);
  document.getElementById('clip-top-rect').setAttribute('height', innerSize);

  document.getElementById('clip-bot-rect').setAttribute('x',      innerX);
  document.getElementById('clip-bot-rect').setAttribute('y',      botY);
  document.getElementById('clip-bot-rect').setAttribute('width',  innerSize);
  document.getElementById('clip-bot-rect').setAttribute('height', innerSize);

  const topFill = document.getElementById('top-fill');
  topFill.setAttribute('x',      innerX);
  topFill.setAttribute('y',      topY);
  topFill.setAttribute('width',  innerSize);
  topFill.setAttribute('height', innerSize);
  topFill.style.transformOrigin = `${cx}px ${topY + innerSize}px`;

  const botFill = document.getElementById('bot-fill');
  botFill.setAttribute('x',      innerX);
  botFill.setAttribute('y',      botY);
  botFill.setAttribute('width',  innerSize);
  botFill.setAttribute('height', innerSize);
  botFill.style.transformOrigin = `${cx}px ${botY + innerSize}px`;

  // Set cycle duration
  document.documentElement.style.setProperty('--cycle', `${CYCLE}s`);
</script>
</body>
</html>
