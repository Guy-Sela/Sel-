<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vibrant Oklab Contrast (16x16)</title>
        <style>
            body {
                background-color: black;
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            canvas {
                width: 400px;
                height: 400px;
                image-rendering: pixelated;
                border: 2px solid #222;
            }
        </style>
    </head>
    <body>
        <canvas id="artCanvas" width="16" height="16"></canvas>

        <script>
            const canvas = document.getElementById("artCanvas");
            const ctx = canvas.getContext("2d");
            const gridSize = 16;

            // --- 1. COLOR CONVERSION MATH (HSL -> RGB -> OKLAB) ---
            function hslToRgb(h, s, l) {
                s /= 100;
                l /= 100;
                const k = (n) => (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = (n) =>
                    l -
                    a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
                return [
                    Math.round(255 * f(0)),
                    Math.round(255 * f(8)),
                    Math.round(255 * f(4)),
                ];
            }

            function rgbToOklab(r, g, b) {
                let r_l = r / 255,
                    g_l = g / 255,
                    b_l = b / 255;
                r_l =
                    r_l > 0.04045
                        ? Math.pow((r_l + 0.055) / 1.055, 2.4)
                        : r_l / 12.92;
                g_l =
                    g_l > 0.04045
                        ? Math.pow((g_l + 0.055) / 1.055, 2.4)
                        : g_l / 12.92;
                b_l =
                    b_l > 0.04045
                        ? Math.pow((b_l + 0.055) / 1.055, 2.4)
                        : b_l / 12.92;

                const l =
                    0.4122214708 * r_l +
                    0.5363325363 * g_l +
                    0.0514459929 * b_l;
                const m =
                    0.2119034982 * r_l +
                    0.6806995451 * g_l +
                    0.1073969566 * b_l;
                const s =
                    0.0883024619 * r_l +
                    0.2817188376 * g_l +
                    0.6299787005 * b_l;

                const l_ = Math.cbrt(l),
                    m_ = Math.cbrt(m),
                    s_ = Math.cbrt(s);

                return {
                    L: 0.2104542553 * l_ + 0.793617785 * m_ - 0.0040720468 * s_,
                    a: 1.9779984951 * l_ - 2.428592205 * m_ + 0.4505937099 * s_,
                    b: 0.0259040371 * l_ + 0.7827717662 * m_ - 0.808675766 * s_,
                    r,
                    g,
                    b_val: b,
                };
            }

            function deltaE(c1, c2) {
                return Math.sqrt(
                    Math.pow(c1.L - c2.L, 2) +
                        Math.pow(c1.a - c2.a, 2) +
                        Math.pow(c1.b - c2.b, 2),
                );
            }

            // --- 2. GENERATE A GORGEOUS VIBRANT POOL ---
            // We generate 256 beautifully saturated spectrum colors (no mud!)
            let colorPool = [];
            for (let i = 0; i < 256; i++) {
                const hue = i * (360 / 256);
                const [r, g, b] = hslToRgb(hue, 95, 60); // High saturation, perfect brightness
                colorPool.push(rgbToOklab(r, g, b));
            }

            // --- 3. THE GRID & QUEUE SETUP ---
            const grid = Array.from({ length: gridSize }, () =>
                Array(gridSize).fill(null),
            );
            const frontier = [];
            const inFrontier = Array.from({ length: gridSize }, () =>
                Array(gridSize).fill(false),
            );
            const directions = [
                [0, -1],
                [1, 0],
                [0, 1],
                [-1, 0],
            ];

            function addFrontier(x, y) {
                if (
                    x >= 0 &&
                    x < gridSize &&
                    y >= 0 &&
                    y < gridSize &&
                    !grid[x][y] &&
                    !inFrontier[x][y]
                ) {
                    frontier.push({ x, y });
                    inFrontier[x][y] = true;
                }
            }

            // --- 4. THE SEED ---
            const startX = Math.floor(Math.random() * gridSize);
            const startY = Math.floor(Math.random() * gridSize);
            const seedIndex = Math.floor(Math.random() * colorPool.length);
            const seedColor = colorPool.splice(seedIndex, 1)[0];

            grid[startX][startY] = seedColor;

            for (const [dx, dy] of directions) {
                addFrontier(startX + dx, startY + dy);
            }

            // --- 5. THE GREEDY CONTRAST LOOP ---
            while (frontier.length > 0) {
                const current = frontier.shift();
                const cx = current.x;
                const cy = current.y;

                const coloredNeighbors = [];
                for (const [dx, dy] of directions) {
                    const nx = cx + dx,
                        ny = cy + dy;
                    if (
                        nx >= 0 &&
                        nx < gridSize &&
                        ny >= 0 &&
                        ny < gridSize &&
                        grid[nx][ny]
                    ) {
                        coloredNeighbors.push(grid[nx][ny]);
                    }
                }

                let bestColorIndex = -1;
                let highestMinDistance = -1;

                for (let i = 0; i < colorPool.length; i++) {
                    const candidateColor = colorPool[i];
                    let shortestDistanceToANeighbor = Infinity;

                    for (const neighborColor of coloredNeighbors) {
                        const dist = deltaE(candidateColor, neighborColor);
                        if (dist < shortestDistanceToANeighbor) {
                            shortestDistanceToANeighbor = dist;
                        }
                    }

                    if (shortestDistanceToANeighbor > highestMinDistance) {
                        highestMinDistance = shortestDistanceToANeighbor;
                        bestColorIndex = i;
                    }
                }

                const bestColor = colorPool.splice(bestColorIndex, 1)[0];
                grid[cx][cy] = bestColor;

                for (const [dx, dy] of directions) {
                    addFrontier(cx + dx, cy + dy);
                }
            }

            // --- 6. DRAW RESULT ---
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const color = grid[x][y];
                    ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b_val})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        </script>
    </body>
</html>
