<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fade</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }

  #veil {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    animation-name: breathe;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes breathe {
    0%   { opacity: 0; }
    50%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="veil"></div>

  <script>
    // ── dial this ──────────────────────────────────────
    const DURATION = 30; // seconds per half-cycle (black→white or white→black)
    // ───────────────────────────────────────────────────

    document.getElementById('veil').style.animationDuration = (DURATION * 2) + 's';
  </script>
</body>
</html>
