<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Selà</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400&family=Josefin+Sans:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: rgba(0, 0, 0, 0.45);
      --border: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Josefin Sans', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .terminal {
      width: min(980px, 92vw);
      height: min(720px, 100%);
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .terminal-body {
      width: 100%;
      height: 100%;
      padding: clamp(18px, 2.5vw, 42px);
      box-sizing: border-box;
      font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      line-height: 1.7;
      text-align: left;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Prompt + wrapped text alignment */
    .typedline {
      display: grid;
      grid-template-columns: 2ch minmax(0, 1fr);
      align-items: start;
      font-size: clamp(1.0rem, 0.95rem + 0.3vw, 1.1rem);
      flex: 0 0 auto;
    }

    .prompt {
      color: rgba(255, 255, 255, 0.92);
      font-weight: 600;
      user-select: none;
    }

    .line {
      min-width: 0;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .cursor {
      display: inline;
      color: var(--text);
      font-weight: 700;
      opacity: 0.95;
      vertical-align: baseline;
    }

    .cursor.is-hidden {
      visibility: hidden;
    }

    @keyframes blink {
      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }

    .cursor.blink {
      animation: blink 1s infinite step-end;
    }

    .fake-tm {
      font-size: 0.72em;
      vertical-align: super;
      letter-spacing: 0.02em;
      opacity: 0.9;
      margin-left: 0.1ch;
    }

    .pop-num {
      white-space: nowrap;
    }

    /* ANSI stage: starts ~two lines below the typed text */
    .ansi-stage {
      margin-top: calc(2 * 1.7em);
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .ansi-art {
      white-space: pre;
      font-family: Menlo, Monaco, 'Courier New', monospace;
      /* Will be set dynamically: start at terminal font-size then shrink via transform */
      font-size: 10px;
      line-height: 10px;
      flex: 0 0 auto;
      width: max-content;
      transform-origin: top left;
      will-change: transform;
      color: #fff;
    }

    .ansi-cursor {
      display: inline;
      color: #fff;
      font-weight: 700;
      opacity: 0.95;
    }

    .ansi-cursor.blink {
      animation: blink 1s infinite step-end;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="terminal" role="region" aria-label="About Selà">
    <div class="terminal-body">
      <div class="typedline" aria-label="Terminal output">
        <span class="prompt">❯</span>
        <span class="line"><span id="typedText"></span><span id="cursor" class="cursor">_</span></span>
      </div>

      <div class="ansi-stage" aria-label="ANSI portrait stage">
        <div id="ansiArt" class="ansi-art" aria-label="ANSI art"></div>
      </div>
    </div>
  </div>

  <script>
    (function init() {
      const typedText = document.getElementById('typedText');
      const cursor = document.getElementById('cursor');
      const ansiEl = document.getElementById('ansiArt');
      if (!typedText || !cursor || !ansiEl) return;

      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function sleep(ms) { return new Promise(r => window.setTimeout(r, ms)); }
      function setCursorVisible(v) { cursor.classList.toggle('is-hidden', !v); }

      // ------------------------------
      // World population (single ticker, multiple subscribers)
      // ------------------------------
      function initWorldPop() {
        // Fallback when the Census fetch fails: a snapshot copied by hand from
        // https://www.census.gov/popclock/data/population.php/world
        // (population, population_rate per second, last_updated in Unix seconds).
        // Refresh about once a year.
        const FALLBACK = { pop: 8214255503, rate: 2.169339485032978, at: 1792910027 * 1000 };

        const state = {
          text: '—',
          ready: false,
          readyPromise: null,
          _resolveReady: null,
          // Anchor: population _pop at time _at (ms), growing by _rate per second.
          _pop: FALLBACK.pop,
          _rate: FALLBACK.rate,
          _at: FALLBACK.at,
          _timer: null,
          listeners: [],
          subscribe: (fn) => { state.listeners.push(fn); fn(state.now()); },
          start: () => { },
          stop: () => { }
        };

        state.readyPromise = new Promise((resolve) => { state._resolveReady = resolve; });
        const markReady = () => {
          if (state.ready) return;
          state.ready = true;
          state._resolveReady?.();
          state._resolveReady = null;
        };
        const format = (n) => Number(n).toLocaleString('en-US');
        // Computed from elapsed wall-clock time, so throttled background tabs don't drift.
        const current = () => format(Math.floor(state._pop + state._rate * (Date.now() - state._at) / 1000));
        state.text = current();
        state.now = current;

        state.start = () => {
          if (state._timer) return;
          state._timer = window.setInterval(() => {
            state.text = current();
            state.listeners.forEach(fn => fn(state.text));
          }, 1000);
        };

        state.stop = () => {
          if (!state._timer) return;
          window.clearInterval(state._timer);
          state._timer = null;
        };

        const url = `https://www.census.gov/popclock/data/population.php/world?_=${Date.now()}`;
        fetch(url, { cache: 'no-store' })
          .then(r => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
          .then(data => {
            const pop = Number(data?.world?.population);
            const rate = Number(data?.world?.population_rate);
            if (!Number.isFinite(pop) || !Number.isFinite(rate)) throw new Error('bad payload');
            state._pop = pop;
            state._rate = rate;
            state._at = Date.now();
          })
          .catch(() => { /* keep FALLBACK anchor */ })
          .finally(() => {
            state.text = current();
            markReady();
          });

        return state;
      }

      // ------------------------------
      // Text typing (120wpm-ish + pauses)
      // ------------------------------
      async function typeInto(container, text, opts = {}) {
        // 120 WPM ~ 600 CPM ~ ~100ms/char
        const min = opts.minDelay ?? 60;
        const max = opts.maxDelay ?? 100;
        const pausePunct = opts.pausePunct ?? 250;
        const pauseNewline = opts.pauseNewline ?? 250;
        const jitter = () => Math.floor(min + Math.random() * (max - min));

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          container.append(ch);
          container.appendChild(cursor);
          if (ch === '\n') await sleep(pauseNewline);
          else if (ch === '.' || ch === '!' || ch === '?') await sleep(pausePunct + 200);
          else if (ch === ',' || ch === ';' || ch === ':') await sleep(pausePunct);
          else await sleep(jitter());
        }
      }

      // Types a live number: each step shows a prefix of the *current* value,
      // so the finished number is already up to date (no jump on the first tick).
      async function typeLiveNumber(container, getText, opts = {}) {
        const min = opts.minDelay ?? 60;
        const max = opts.maxDelay ?? 100;
        const pausePunct = opts.pausePunct ?? 250;
        for (let i = 1; i <= getText().length; i++) {
          const text = getText();
          container.textContent = text.slice(0, i);
          container.appendChild(cursor);
          await sleep(text[i - 1] === ',' ? pausePunct : Math.floor(min + Math.random() * (max - min)));
        }
        container.textContent = getText();
      }

      async function blinkIdle(ms = 3200) {
        cursor.classList.add('blink');
        setCursorVisible(true);
        await sleep(ms);
        cursor.classList.remove('blink');
        setCursorVisible(true);
      }

      // ------------------------------
      // ANSI -> HTML (grayscale + brightened)
      // ------------------------------
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function ansiToHtml(text) {
        const pattern = /(\x1b\[38;2;\d+;\d+;\d+m)|(\x1b\[0m)/g;
        let html = '';
        let active = false;
        let lastIndex = 0;
        let match;

        while ((match = pattern.exec(text)) !== null) {
          const tag = match[0];
          const idx = match.index;
          if (idx > lastIndex) html += escapeHtml(text.substring(lastIndex, idx));

          if (tag === '\x1b[0m') {
            if (active) {
              html += '</span>';
              active = false;
            }
          } else {
            const rgbMatch = tag.match(/^\x1b\[38;2;(\d+);(\d+);(\d+)m$/);
            if (rgbMatch) {
              const r = Number(rgbMatch[1]);
              const g = Number(rgbMatch[2]);
              const b = Number(rgbMatch[3]);

              // Lift midtones without flattening highlights or lifting black to gray.
              const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
              const gray = Math.round(255 * Math.pow(luminance, 0.7));

              if (active) html += '</span>';
              html += `<span style="color: rgb(${gray},${gray},${gray})">`;
              active = true;
            }
          }

          lastIndex = pattern.lastIndex;
        }

        if (lastIndex < text.length) html += escapeHtml(text.substring(lastIndex));
        if (active) html += '</span>';
        return html;
      }

      // ------------------------------
      // Fit ANSI art in its box (scale)
      // ------------------------------
      let ansiSize = null;
      let ansiFitScale = 1;
      let ansiZoomProgress = 1;
      let ansiStageWidth = 0;
      let ansiOffset = { x: 0, y: 0 };

      function computeAnsiFitScale() {
        const stage = ansiEl.parentElement;
        if (!stage || !ansiSize) return 1;
        return Math.min(
          Math.max(0, stage.clientWidth - 4) / ansiSize.width,
          Math.max(0, stage.clientHeight - 4) / ansiSize.height,
          1
        );
      }

      function fitAnsiToScale(scale) {
        const x = ansiOffset.x * ansiZoomProgress;
        const y = ansiOffset.y * ansiZoomProgress;
        ansiEl.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      }

      function updateAnsiFit() {
        if (!ansiSize) return;
        ansiFitScale = computeAnsiFitScale();
        const stage = ansiEl.parentElement;
        ansiStageWidth = stage.clientWidth;
        ansiOffset = {
          x: Math.max(0, (stage.clientWidth - ansiSize.width * ansiFitScale) / 2),
          y: Math.max(0, (stage.clientHeight - ansiSize.height * ansiFitScale) / 2)
        };
        fitAnsiToScale(1 + (ansiFitScale - 1) * ansiZoomProgress);
      }

      function prepareAnsi(html) {
        ansiEl.style.transform = 'none';
        ansiEl.style.width = 'max-content';
        ansiEl.style.height = 'auto';
        ansiEl.innerHTML = html;
        const rect = ansiEl.getBoundingClientRect();
        ansiSize = { width: Math.max(1, rect.width), height: Math.max(1, rect.height) };
        // Reserve the full dimensions so typing cannot shift the scaling origin.
        ansiEl.style.width = `${ansiSize.width}px`;
        ansiEl.style.height = `${ansiSize.height}px`;
        updateAnsiFit();
      }

      window.addEventListener('resize', updateAnsiFit, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateAnsiFit);
      }
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(updateAnsiFit);
        observer.observe(ansiEl.parentElement);
      }

      // ------------------------------
      // ANSI animation:
      // - wait a few seconds after text finishes
      // - start at a human typing pace with pauses
      // - accelerate the reveal while zooming on an independent clock
      // ------------------------------

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
      }

      async function animateAnsi(fullHtml) {
        ansiZoomProgress = 0;
        prepareAnsi(fullHtml);

        const runs = [];
        const walker = document.createTreeWalker(ansiEl, NodeFilter.SHOW_TEXT);
        let node;
        let totalVisible = 0;
        while ((node = walker.nextNode())) {
          const text = node.data;
          runs.push({ node, text });
          totalVisible += text.length;
        }
        for (const run of runs) run.node.data = '';

        const artCursor = document.createElement('span');
        artCursor.className = 'ansi-cursor blink';
        artCursor.textContent = '_';
        ansiEl.appendChild(artCursor);
        let runIndex = 0;
        let offset = 0;
        let visibleDone = 0;

        function reveal(count) {
          let last = '';
          while (count > 0 && runIndex < runs.length) {
            const run = runs[runIndex];
            const take = Math.min(count, run.text.length - offset);
            const chunk = run.text.slice(offset, offset + take);
            run.node.appendData(chunk);
            last = chunk.slice(-1);
            offset += take;
            visibleDone += take;
            count -= take;
            if (offset === run.text.length) {
              runIndex++;
              offset = 0;
            }
          }
          return last;
        }

        // Keep the opening inside the viewport, including on narrow screens.
        await sleep(250);
        const fontSize = parseFloat(getComputedStyle(ansiEl).fontSize) || 16;
        const openingCharacters = Math.min(80, Math.max(1, Math.floor(ansiStageWidth / fontSize)));
        while (visibleDone < Math.min(openingCharacters, totalVisible)) {
          const character = reveal(1);
          await sleep(character === '\n' ? 180 : 60 + Math.floor(Math.random() * 40));
        }

        // Reveal in typing order, but time the zoom independently of frame rate.
        const remaining = totalVisible - visibleDone;
        const startVisible = visibleDone;
        const duration = 12000;
        const zoomDelay = 150;
        return new Promise((resolve) => {
          let startedAt;
          function step(now) {
            if (startedAt === undefined) startedAt = now;
            const elapsed = now - startedAt;
            const progress = Math.min(1, elapsed / duration);
            const target = startVisible + Math.floor(remaining * progress * progress);
            reveal(target - visibleDone);
            ansiZoomProgress = easeOutCubic((elapsed - zoomDelay) / (duration - zoomDelay));
            fitAnsiToScale(1 + (ansiFitScale - 1) * ansiZoomProgress);
            if (progress < 1) requestAnimationFrame(step);
            else resolve();
          }

          requestAnimationFrame(step);
        });
      }

      async function run() {
        const wp = initWorldPop();
        ansiEl.textContent = ''; // keep blank until we start
        setCursorVisible(true);
        await blinkIdle(900);

        const speed120 = { minDelay: 60, maxDelay: 100, pausePunct: 250 };

        await typeInto(typedText, 'Born 1977, Israel.', speed120);
        await sleep(1300);
        await typeInto(typedText, ' On a good day, one in ', speed120);

        const popSpan1 = document.createElement('span');
        popSpan1.className = 'pop-num';
        typedText.appendChild(popSpan1);

        await Promise.race([wp.readyPromise, sleep(2000)]);
        await typeLiveNumber(popSpan1, wp.now, { minDelay: 80, maxDelay: 120, pausePunct: 240 });
        typedText.appendChild(cursor);
        wp.subscribe((val) => { popSpan1.textContent = val; });
        wp.start();

        await typeInto(typedText, '.', speed120);
        await sleep(1150);
        await typeInto(typedText, ' On a bad day, one of ', speed120);

        const popSpan2 = document.createElement('span');
        popSpan2.className = 'pop-num';
        typedText.appendChild(popSpan2);

        await typeLiveNumber(popSpan2, wp.now, { minDelay: 80, maxDelay: 120, pausePunct: 240 });
        typedText.appendChild(cursor);
        wp.subscribe((val) => { popSpan2.textContent = val; });

        await typeInto(typedText, '.', speed120);
        await sleep(1800);
        await typeInto(typedText, ' Code for Consciousness', speed120);

        const tm = document.createElement('span');
        tm.className = 'fake-tm';
        tm.textContent = 'TM';
        typedText.appendChild(tm);
        typedText.appendChild(cursor);
        await typeInto(typedText, '.', speed120);

        // A few seconds after the text finishes animating...
        await sleep(3200);

        // Move attention to ANSI: stop terminal cursor once the terminal line is done.
        cursor.classList.remove('blink');
        setCursorVisible(false);

        // Load ANSI portrait
        let ansiRaw = '';
        try {
          const res = await fetch('ascii-profile.txt', { cache: 'no-store' });
          if (!res.ok) throw new Error(String(res.status));
          ansiRaw = await res.text();
        } catch (e) {
          ansiEl.textContent = 'Could not load ascii-profile.txt';
          return;
        }

        const html = ansiToHtml(ansiRaw);
        // Start ANSI at the same font size as the terminal text, then shrink via transform as it draws.
        const typedLineEl = document.querySelector('.typedline');
        const typedFontPx = typedLineEl ? parseFloat(getComputedStyle(typedLineEl).fontSize || '16') : 16;
        ansiEl.style.fontSize = `${typedFontPx}px`;
        ansiEl.style.lineHeight = `${typedFontPx}px`;

        if (document.fonts) await document.fonts.ready;
        await animateAnsi(html);
      }

      if (reduce) {
        // Minimal static render for reduced motion
        const wp = initWorldPop();
        typedText.textContent = 'Born 1977, Israel.';
        for (const phrase of [' On a good day, one in ', ' On a bad day, one of ']) {
          typedText.appendChild(document.createTextNode(phrase));
          const population = document.createElement('span');
          population.className = 'pop-num';
          typedText.appendChild(population);
          wp.subscribe(value => { population.textContent = value; });
          typedText.appendChild(document.createTextNode('.'));
        }
        wp.start();
        typedText.appendChild(document.createTextNode(' Code for consciousness'));
        const tm = document.createElement('span');
        tm.className = 'fake-tm';
        tm.textContent = 'TM';
        typedText.appendChild(tm);
        typedText.appendChild(document.createTextNode('.'));
        setCursorVisible(false);
        fetch('ascii-profile.txt').then(r => r.text()).then(async t => {
          if (document.fonts) await document.fonts.ready;
          prepareAnsi(ansiToHtml(t));
        }).catch(() => { });
        return;
      }

      run().catch(() => { /* no-op */ });
    })();
  </script>
</body>

</html>
